[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fractalsig"
version = "1.0.0"
description = "Code for 'Scale Without Support: Fractal Signatures Are Not Document Representations'"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.4,<3",
  "pandas>=3.0,<4",
  "scipy>=1.17,<2",
  "scikit-learn>=1.9,<2",
  "lightgbm>=4.7,<5",
  "pyarrow>=25",
  "joblib>=1.6",
  "matplotlib>=3.11",
  "fbm>=0.3",
  "requests>=2.34",
  "huggingface-hub>=1.28,<2",
  "transformers>=5.14,<6",
]

[project.optional-dependencies]
gpu = ["torch>=2.13", "sentence-transformers>=5.7,<6", "gudhi>=3.13"]
dev = ["pytest>=9"]

[tool.setuptools.packages.find]
include = ["fractalsig*", "experiments*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
